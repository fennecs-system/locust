name = "session-cache"
language = "python"
description = "Adds LRU eviction, sliding expiry and a lock to an in-memory session store."

notes = """
This is a session store for a web service. Sessions are written on login and
read on every authenticated request, so reads vastly outnumber writes and the
store is shared across request threads.
"""

[[defect]]
id = "hits-entries-desync"
file = "src/cache.py"
lines = [20, 40]
severity = "high"
summary = """
The lazy-expiry branch in get() deletes from _entries but leaves _hits, so
_evict() can select a key absent from _entries and raise KeyError out of put().
"""
matches = ["_hits", "KeyError"]

[[defect]]
id = "unlocked-read-write"
file = "src/cache.py"
lines = [15, 30]
severity = "high"
summary = """
get() became a writer (hit counting and sliding expiry) but stays outside the
lock that put() holds, so the lock serialises writers against each other only.
For example, a read can restore a session evicted by a concurrent put(), taking
the cache past max_entries. That is a consequence of this same unlocked writer.
"""
matches = ["get()", "lock"]

[[defect]]
id = "lfu-not-lru"
file = "src/cache.py"
lines = [6, 45]
severity = "medium"
summary = """
The docstring promises LRU, but _hits is a non-decaying lifetime counter and
_evict minimises over it. That is LFU without decay; it will evict an entry read
one second ago in favour of one untouched for hours.
"""
matches = ["lru"]

[[defect]]
id = "put-resets-hit-count"
file = "src/cache.py"
lines = [31, 40]
severity = "medium"
summary = """
put() unconditionally sets _hits[key] = 0, so refreshing the hottest session
demotes it to the strict minimum and the next put() evicts it.
"""
# `"0"` alone collided: it is one character, so every finding mentioning
# `_hits` also matched this entry, and the ambiguity rule then left the
# genuine `hits-entries-desync` report unclassified and reported as missed.
# The literal assignment names this defect and nothing else. A report that
# describes it without quoting the line lands in triage, which is the right
# place for a call this close to another entry.
matches = ["_hits[key] = 0"]

[[defect]]
id = "put-evicts-on-update"
file = "src/cache.py"
lines = [28, 36]
severity = "medium"
summary = """
put() runs the capacity check before determining whether the key already
exists, so overwriting a resident session at capacity evicts an unrelated live
session and drops the resident set below max_entries.
"""
# Surfaced as an unclassified finding on the first benchmark run: a real defect
# the case author missed. That is what the triage column is for.
matches = ["put()", "evict", "updat"]

[[defect]]
id = "purge-deletes-refreshed-session"
file = "src/cache.py"
lines = [44, 49]
severity = "high"
summary = """
purge_expired() snapshots expired keys, then deletes them without checking
whether put() has refreshed the session in the meantime. A fresh login can
therefore be removed using the old session's expiry decision. The snapshot
prevents a dictionary-iteration exception, but does not protect replacements.
"""
matches = ["purge_expired()", "refresh", "snapshot"]

# Two further claims about this file are *false* and are deliberately not
# planted here: that `size()` racing a writer can produce an inconsistent
# count, and that `purge_expired()` mutates the dict it iterates. Reviewers
# never raised either in a live run — six planted decoys across three cases
# drew nothing — so they stopped being an answer-key entry and became probe
# input. They now live in `crates/locust-core/tests/defence_probe.rs`, which
# feeds them to the defence directly instead of waiting for an attacker to
# take the bait. The code they are about stays here, because it is ordinary
# code: a size accessor and a snapshotting sweep.
