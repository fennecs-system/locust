# Publishes a GitHub Release with prebuilt `locust` binaries attached.
#
# Triggered only by pushing a version tag (e.g. `v0.1.0`) — never by an
# ordinary push to `main`, which just uploads build artifacts (see ci.yml).
#
# Uses the default GITHUB_TOKEN; no secrets and no external registries.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: locust-linux-x86_64
          - os: macos-latest
            artifact: locust-macos-aarch64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build
        run: cargo build --release --locked -p locust-cli

      - name: Strip
        run: strip target/release/locust

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C target/release locust

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # The only place that needs write access to the repository.
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be published
        run: ls -lR dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
